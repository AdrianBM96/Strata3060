<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oficina Strata</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%2316a34a%22/%3E%3Cpath d=%22M6 18V10l6-4 6 4v8%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222%22/%3E%3C/svg%3E">
<style>
:root{
  --bg:#e9ecf1;--panel:#ffffff;--panel2:#f5f6f9;--text:#0f172a;--muted:#64748b;--faint:#94a3b8;--line:#e3e6ec;
  --ink:#111827;--inkText:#fff;--accent:#2563eb;--accentSoft:#e8efff;--ok:#16a34a;--okSoft:#e7f6ec;--warn:#d97706;--warnSoft:#fdf3e2;
  --bad:#dc2626;--badSoft:#fdeaea;--shadow:0 1px 2px rgba(15,23,42,.05),0 8px 28px rgba(15,23,42,.07);--r:18px
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0a0c11;--panel:#12151d;--panel2:#181c26;--text:#e6e8ee;--muted:#98a2b3;--faint:#667085;--line:#232836;
  --ink:#e6e8ee;--inkText:#0f131b;--accent:#6ea0ff;--accentSoft:#17223a;--ok:#34d27a;--okSoft:#10261a;--warn:#f5a524;--warnSoft:#2a2010;
  --bad:#f87171;--badSoft:#2c1416;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35)}}
:root[data-theme=dark]{
  --bg:#0a0c11;--panel:#12151d;--panel2:#181c26;--text:#e6e8ee;--muted:#98a2b3;--faint:#667085;--line:#232836;
  --ink:#e6e8ee;--inkText:#0f131b;--accent:#6ea0ff;--accentSoft:#17223a;--ok:#34d27a;--okSoft:#10261a;--warn:#f5a524;--warnSoft:#2a2010;
  --bad:#f87171;--badSoft:#2c1416;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font:13.5px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* Escenario 16:9 con letterbox */
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));
  display:grid;grid-template-columns:64px 250px 1fr 330px;gap:12px;padding:12px;overflow:hidden}
#stage.compact{grid-template-columns:56px 1fr;gap:8px;padding:8px}
#stage.compact #side,#stage.compact #subtitle,#stage.compact .legend,#stage.compact .float{display:none}
#stage.compact #head h1{font-size:18px}
#stage.compact #contract{max-width:40%;overflow:hidden;text-overflow:ellipsis}
#stage.compact #insp{position:absolute;right:8px;top:8px;bottom:8px;width:min(340px,62%);z-index:40;transform:translateX(calc(100% + 16px));transition:transform .25s ease}
#stage.compact.drawer #insp{transform:none}
#closeInsp{display:none;position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:9px;background:var(--panel2);z-index:2}
#stage.compact #closeInsp{display:grid;place-items:center}
#stage.compact .tabs{padding-right:46px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
/* Rail */
#rail{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0}
.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#22c55e,#15803d);color:#fff;margin-bottom:10px}
.rb{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s;position:relative}
.rb:hover{background:var(--panel2);color:var(--text)}
.rb.on{background:var(--ink);color:var(--inkText)}
.rb .tip{position:absolute;left:52px;white-space:nowrap;background:var(--ink);color:var(--inkText);font-size:12px;padding:4px 8px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:20}
.rb:hover .tip{opacity:1}
.grow{flex:1}
/* Sidebar */
#side{display:flex;flex-direction:column;padding:16px;gap:10px;min-height:0}
.h{font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:6px 2px 0}
.off{display:flex;gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:14px;text-align:left;width:100%;
  transition:border-color .15s,background .15s,transform .12s;position:relative}
.off:hover{background:var(--panel2)}
.off.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentSoft)}
.off .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);font-size:17px;flex:none}
.off b{display:block;font-weight:620;font-size:13.5px}
.off small{color:var(--muted);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bad);position:absolute;right:10px;top:10px}
.new{border:1.5px dashed var(--line);border-radius:14px;padding:10px;color:var(--muted);width:100%;transition:color .15s,border-color .15s}
.new:hover{color:var(--accent);border-color:var(--accent)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{padding:10px 12px;border-radius:14px;background:var(--panel2)}
.kpi small{color:var(--muted);font-size:11.5px;display:block}
.kpi b{font-size:18px;font-weight:680;letter-spacing:-.02em}
.kpi i{font-style:normal;font-size:11.5px;font-weight:600}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
/* Centro */
#center{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
#head{display:flex;align-items:center;gap:12px;padding:2px 6px}
#head h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.02em}
#head .sub{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.chip.amber{background:var(--warnSoft);border-color:transparent;color:var(--warn)}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-weight:600;font-size:12.5px}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:pulse 2s infinite}
.live.off{color:var(--bad)}.live.off::before{animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 50%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
#view{position:relative;flex:1;min-height:0;overflow:hidden}
#scene{position:absolute;inset:0;border-radius:var(--r);overflow:hidden}
#scene canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none}
.pill{position:absolute;transform:translate(-50%,0);pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:6px;
  background:var(--ink);color:var(--inkText);font-size:11.5px;font-weight:650;padding:4px 9px 4px 7px;border-radius:999px;white-space:nowrap;
  box-shadow:0 4px 14px rgba(0,0,0,.18);transition:transform .15s,opacity .2s}
.pill:hover{transform:translate(-50%,-2px)}
.pill.sel{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.pill em{font-style:normal;font-weight:500;opacity:.65;text-transform:uppercase;font-size:10px;letter-spacing:.05em}
.led{width:7px;height:7px;border-radius:50%;flex:none}
.bub{position:absolute;transform:translate(-50%,-100%);max-width:250px;background:var(--panel);color:var(--text);border:1.5px solid var(--ink);
  border-radius:14px;padding:8px 11px;font-size:12px;box-shadow:var(--shadow);pointer-events:auto;cursor:pointer}
.bub::after{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;background:var(--panel);border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.bub b{display:inline-block;background:var(--ink);color:var(--inkText);font-size:9.5px;letter-spacing:.06em;padding:2px 6px;border-radius:5px;margin-right:6px}
.float{position:absolute;display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:12.5px;
  box-shadow:0 1px 2px rgba(0,0,0,.04);transition:background .15s,border-color .15s,transform .12s}
.btn:hover{background:var(--panel2)}.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.dark{background:var(--ink);color:var(--inkText);border-color:var(--ink)}
.legend{position:absolute;right:14px;bottom:14px;display:flex;gap:12px;font-size:11.5px;color:var(--muted);background:color-mix(in srgb,var(--panel) 80%,transparent);
  padding:6px 10px;border-radius:10px;backdrop-filter:blur(6px)}
.legend span{display:inline-flex;align-items:center;gap:5px}
/* Chat */
#chat{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;border-radius:16px}
#to{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--inkText);font-weight:650;font-size:12.5px;padding:7px 11px;border-radius:11px;position:relative}
#to .led{width:7px;height:7px}
#msg{flex:1;border:0;outline:0;background:transparent;font:inherit;color:inherit;padding:8px 2px}
#msg::placeholder{color:var(--faint)}
#send{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--panel2);transition:background .15s,color .15s}
#send:hover{background:var(--accent);color:#fff}
#menu{position:absolute;bottom:46px;left:0;min-width:230px;padding:6px;display:none;z-index:30}
#menu.open{display:block}
#menu button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:10px;text-align:left}
#menu button:hover,#menu button.on{background:var(--panel2)}
#menu small{color:var(--muted);margin-left:auto;font-size:11px}
/* Inspector */
#insp{display:flex;flex-direction:column;min-height:0;position:relative}
.tabs{display:flex;gap:4px;padding:10px 10px 0}
.tab{flex:1;padding:9px 0;border-radius:12px;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.tab.on{background:var(--ink);color:var(--inkText)}
.tab:not(.on):hover{background:var(--panel2);color:var(--text)}
#ipane{flex:1;overflow:auto;padding:14px 16px 18px;scrollbar-width:thin}
.who{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--panel2)}
.av{width:46px;height:46px;flex:none}
.who b{font-size:15px;font-weight:680}
.who small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.st{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:7px;text-transform:uppercase;align-self:flex-start}
.st.working{background:var(--okSoft);color:var(--ok)}.st.idle{background:var(--panel);color:var(--muted);border:1px solid var(--line)}
.st.waiting{background:var(--warnSoft);color:var(--warn)}.st.blocked{background:var(--badSoft);color:var(--bad)}
.act{margin:10px 2px 0;color:var(--muted);font-size:12.5px}
.act b{color:var(--text);font-weight:600}
.sec{margin:20px 2px 8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);display:flex;justify-content:space-between}
.need{border:1.5px solid var(--accent);border-radius:16px;padding:12px;background:linear-gradient(180deg,var(--accentSoft),transparent 70%);margin-bottom:8px}
.need .tag{display:inline-block;background:var(--ink);color:var(--inkText);font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:5px}
.need p{margin:8px 0 10px;font-size:13px}
.need .meta{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.empty{color:var(--muted);font-size:13px;padding:10px 12px;border-radius:12px;background:var(--panel2);display:flex;gap:8px;align-items:center}
.wait{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:12px;background:var(--panel2);margin-bottom:6px;font-size:12.5px}
.wait b{font-weight:650}
.tl{position:relative;margin-left:10px;padding-left:20px;border-left:1.5px solid var(--line)}
.step{position:relative;padding:0 0 14px}
.step::before{content:"";position:absolute;left:-28px;top:1px;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--faint);background:var(--panel)}
.step.hecho::before{background:var(--ink);border-color:var(--ink)}
.step.hecho::after{content:"";position:absolute;left:-23.5px;top:4.5px;width:4px;height:7px;border:solid var(--inkText);border-width:0 1.6px 1.6px 0;transform:rotate(45deg)}
.step.curso::before{border-color:var(--accent);border-width:4px;width:9px;height:9px}
.step b{font-weight:620;font-size:13px;display:block}
.step small{color:var(--muted);font-size:11.5px}
.bar{height:5px;border-radius:5px;background:var(--panel2);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .4s}
.task{margin-bottom:8px}
.task .tt{font-weight:680;font-size:13px;margin:0 0 8px}
.task .tt span{color:var(--muted);font-weight:500}
pre.log{margin:0;white-space:pre-wrap;word-break:break-word;font-size:11.5px;line-height:1.5;background:var(--panel2);border-radius:12px;padding:12px;color:var(--text)}
.msgs .m{padding:9px 11px;border-radius:12px;background:var(--panel2);margin-bottom:6px;font-size:12.5px}
.msgs .m small{display:block;color:var(--muted);font-size:11px}
/* Vistas alternativas (métricas, tablero, campus) */
.panelview{position:absolute;inset:0;overflow:auto;padding:4px 4px 12px;display:none}
.panelview.on{display:block}
.grid{display:grid;gap:12px}
.g5{grid-template-columns:repeat(5,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
.mcard{padding:16px}
.mcard small{color:var(--muted);font-size:12px;font-weight:600}
.mcard .v{font-size:30px;font-weight:720;letter-spacing:-.03em;margin:4px 0 0}
.mcard .v span{font-size:13px;color:var(--muted);font-weight:600;margin-left:4px}
.mcard .d{font-size:12.5px;font-weight:650}
.mcard svg{display:block;margin-top:10px;width:100%;height:42px}
.goal{padding:16px}
.goal b{font-size:14px}
.goal .bar{height:9px;margin:10px 0 6px}
.goal small{color:var(--muted)}
.boss{padding:16px;display:flex;gap:16px;align-items:center}
.boss .hp{flex:1}
.boss .bar i{background:linear-gradient(90deg,#ef4444,#f97316)}
.kan{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:start}
.col{background:var(--panel2);border-radius:16px;padding:10px;min-height:120px}
.col h4{margin:2px 4px 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);display:flex;justify-content:space-between}
.tc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;font-size:12.5px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tc b{display:block;font-weight:650;margin-bottom:4px}
.tc .who2{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11.5px;margin-top:6px}
.tc p{margin:0;color:var(--muted);font-size:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.camp{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.oc{padding:14px;text-align:left;transition:transform .15s,box-shadow .15s;position:relative}
.oc:hover{transform:translateY(-2px)}
.oc .ill svg{width:44px;height:44px;color:var(--muted)}
.oc .ill{height:110px;border-radius:12px;margin-bottom:12px;background:
  radial-gradient(ellipse at 50% 85%,rgba(0,0,0,.12),transparent 60%),linear-gradient(160deg,var(--panel2),var(--bg));display:grid;place-items:center;font-size:40px}
/* Modal / toast */
#modal{position:fixed;inset:0;background:rgba(10,12,17,.38);backdrop-filter:blur(3px);display:none;place-items:center;z-index:50}
#modal.on{display:grid}
#modal .card{width:min(420px,92vw);padding:22px}
#modal h3{margin:0 0 6px;font-size:17px}
#modal p{margin:0 0 14px;color:var(--muted)}
#modal input{width:100%;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none}
#modal input:focus{border-color:var(--accent)}
#modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--ink);color:var(--inkText);padding:10px 14px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;max-width:360px;animation:tin .25s ease-out}
.toast.bad{background:var(--bad);color:#fff}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
#rotate{position:fixed;inset:0;display:none;place-items:center;text-align:center;background:var(--bg);z-index:100;padding:24px}
#rotate svg{margin-bottom:14px;animation:rot 2.4s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:900px){#rotate{display:grid}#stage{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stage">
  <nav id="rail" class="card" aria-label="Navegación">
    <div class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6"/></svg></div>
    <button class="rb on" data-view="oficina" aria-label="Oficina"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="10" width="18" height="3" rx="1"/><path d="M5 13v7M19 13v7M8 10V5h8v5"/></svg><span class="tip">Oficina · O</span></button>
    <button class="rb" data-view="tablero" aria-label="Tablero"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/></svg><span class="tip">Tablero de misiones · T</span></button>
    <button class="rb" data-view="metricas" aria-label="Métricas"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-7"/></svg><span class="tip">Métricas · M</span></button>
    <button class="rb" data-view="campus" aria-label="Campus"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="tip">Campus · C</span></button>
    <div class="grow"></div>
    <button class="rb" id="themeBtn" aria-label="Cambiar tema"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span class="tip">Tema claro / oscuro</span></button>
  </nav>

  <aside id="side" class="card">
    <div class="h">Oficinas</div>
    <div id="offices" style="display:flex;flex-direction:column;gap:8px"></div>
    <button class="new" id="newOff">+ Nueva oficina</button>
    <div class="h" style="margin-top:14px">Producción</div>
    <div class="mini" id="sideKpi"></div>
    <div class="grow"></div>
    <div class="h">Cola</div>
    <div class="kpi"><small id="qtxt">—</small><div class="bar"><i id="qbar" style="width:0"></i></div></div>
  </aside>

  <main id="center">
    <header id="head">
      <h1 id="title">Strata3060</h1>
      <span class="sub" id="subtitle">—</span>
      <span class="chip amber" id="contract" hidden></span>
      <span class="grow"></span>

      floor:'#3a3f48',edge:'#272b33',wall:'#3b414d',wood:'#8a6a4a',desk:'#a8835e',rug:'#3a4152',rug2:'#373d4c',metal:'#4b5363',screen:'#0f172a',sky:0x8fa3c7,ground:0x1a1d26,hemiI:.6,sunI:.5,exp:1.0,glass:'#7fa6d9',board:'#e9edf2'}:{

  function drawBoard(){const c=boardCanvas.getContext('2d'),w=1024,h=624;c.fillStyle='#fbfcfd';c.fillRect(0,0,w,h);
    const cols=['EN COLA','EN CURSO','ESPERA OK','HECHO'];const T=(S&&S.tareas)||[];const cw=w/4;

        c.font='500 17px Inter,system-ui,sans-serif';c.fillStyle='#374151';const words=(t.titulo||'').split(' ');let line='',yy=20;for(const wd of words){if(c.measureText(line+wd).width>92){c.fillText(line,-45,yy);line='';yy+=20;if(yy>48)break}line+=wd+' '}if(yy<=48)c.fillText(line,-45,yy);c.restore()})});

  function buildRoom(){

  /* código falso pero creíble para las pantallas */
  function codeLines(seed){let x=seed*9301+49297;const r=()=>(x=(x*9301+49297)%233280)/233280;const C=['#7dd3fc','#c4b5fd','#86efac','#fca5a5','#fde68a','#e2e8f0'];
    return Array.from({length:40},()=>{const n=1+Math.floor(r()*4);let ind=Math.floor(r()*3)*14;return Array.from({length:n},()=>{const w=18+r()*70;const seg={x:ind,w,c:C[Math.floor(r()*C.length)]};ind+=w+8;return seg})})}
  function drawCode(d,name,act,st,t){const u=d.userData,c=u.cv.getContext('2d'),W2=320,H2=192;
    c.fillStyle='#0b1220';c.fillRect(0,0,W2,H2);c.fillStyle='#111a2e';c.fillRect(0,0,W2,22);

    c.fillStyle='#94a3b8';c.font='600 11px ui-monospace,monospace';c.fillText(name+' · '+String(act||'').slice(0,30),52,15);
    if(st==='idle'){const col=lookOf(name,workerIdx[name]||0).shirt;const g2=c.createLinearGradient(0,22,W2,H2);g2.addColorStop(0,'#0f172a');g2.addColorStop(1,col);c.globalAlpha=.55;c.fillStyle=g2;c.fillRect(0,22,W2,H2-22);c.globalAlpha=1;
      c.fillStyle='rgba(255,255,255,.9)';c.font='700 22px Inter,system-ui,sans-serif';c.textAlign='center';c.fillText(name,W2/2,104);c.font='500 13px Inter,system-ui,sans-serif';c.fillStyle='rgba(255,255,255,.7)';c.fillText('en pausa · café',W2/2,126);c.textAlign='left';u.tex.needsUpdate=true;return}
    const off=Math.floor(t/260)%40;
    for(let k=0;k<11;k++){const ln=u.code[(off+k)%40];const y=34+k*14;c.fillStyle='#334155';c.fillRect(6,y,10,6);for(const sg of ln){c.fillStyle=sg.c;c.globalAlpha=.85;c.fillRect(22+sg.x,y,sg.w,7);c.globalAlpha=1}}

  /* empleado virtual: articulaciones jerárquicas para sentarse, teclear, caminar y tomar café */
  const SKIN=['#f1c9a5','#e8b48d','#c98d63','#f3cfae','#e9bf9b','#b97a54','#f0c39d','#d9a07a'];
  const HAIR={claude:['#cfd4da','short'],opencode2:['#3b2416','messy'],explorer:['#111827','bun'],tester:['#c58b2b','bob'],suplente:['#5b3a29','short']};
  function employee(name,L,i){
    const skin=SKIN[(Object.keys(LOOK).indexOf(name)+8+i)%8],[hairC,style]=HAIR[name]||[['#2b2b2b','#8b5a2b','#7c2d12'][i%3],['messy','short','bob'][i%3]];
    const root=new THREE.Group(),hips=new THREE.Group();hips.position.y=.62;root.add(hips);
    const torso=cap(.17,.24,L.shirt);torso.position.y=.25;hips.add(torso);
    hips.add(Object.assign(box(.2,.05,.06,'#f8fafc',0,.47,.12),{}));               // cuello de la camisa
    const badge=box(.07,.09,.012,'#ffffff',.08,.3,.168);hips.add(badge);hips.add(box(.07,.02,.013,L.shirt,.08,.33,.17));
    const head=new THREE.Group();head.position.y=.72;hips.add(head);
    head.add(sph(.2,skin,0,0,0));
    const hair=sph(.212,hairC,0,.04,-.02);hair.scale.set(.212,.17,.212);head.add(hair);
    if(style==='messy'){for(const [x,z] of[[-.08,.1],[.06,.13],[.12,.04]])head.add(sph(.06,hairC,x,.17,z))}
    if(style==='bun')head.add(sph(.08,hairC,0,.2,-.1));
    if(style==='bob'){const b=sph(.215,hairC,0,-.04,-.03);b.scale.set(.225,.17,.2);head.add(b)}
    for(const x of[-.07,.07])head.add(sph(.022,'#1f2937',x,.0,.186));
    const mouth=box(.06,.012,.01,'#9a4a3a',0,-.075,.19);head.add(mouth);
    if(L.glasses)for(const x of[-.07,.07]){const r=new THREE.Mesh(new THREE.TorusGeometry(.045,.008,6,18),mat('#111827'));r.position.set(x,0,.195);head.add(r)}
    const band=new THREE.Mesh(new THREE.TorusGeometry(.215,.012,6,24,Math.PI),mat('#1f2937'));band.position.y=.02;head.add(band);   // auriculares
    for(const x of[-.21,.21])head.add(cyl(.055,.04,'#1f2937',x,0,0).rotateZ(Math.PI/2));
    const mic=box(.012,.012,.14,'#1f2937',-.2,-.07,.08);mic.rotation.y=.35;head.add(mic);
    const arms=[],legs=[];
    for(const sd of[-1,1]){
      const sh=new THREE.Group();sh.position.set(sd*.215,.44,0);hips.add(sh);
      const ua=cap(.058,.15,L.shirt);ua.position.y=-.1;sh.add(ua);
      const el=new THREE.Group();el.position.y=-.22;sh.add(el);
      const fa=cap(.05,.13,skin);fa.position.y=-.09;el.add(fa);const hand=sph(.055,skin,0,-.19,0);el.add(hand);
      arms.push({sh,el,hand});
      const lg=new THREE.Group();lg.position.set(sd*.09,0,0);hips.add(lg);
      const th=cap(.075,.15,'#2f3542');th.position.y=-.12;lg.add(th);
      const kn=new THREE.Group();kn.position.y=-.26;lg.add(kn);
      const sn=cap(.066,.15,'#2f3542');sn.position.y=-.12;kn.add(sn);kn.add(box(.12,.07,.21,'#111827',0,-.31,.04));
      legs.push({lg,kn});
    }
    const mug=cyl(.045,.09,'#ffffff',0,-.05,.06);mug.add(box(.012,.04,.03,'#ffffff',0,0,0).translateX(.05));arms[1].hand.add(mug);
    const hit=new THREE.Mesh(new THREE.CapsuleGeometry(.3,.8,4,8),new THREE.MeshBasicMaterial({visible:false}));hit.position.y=.65;root.add(hit);
    root.userData={name,hips,head,arms,legs,mug,hit,mode:'',walk:null};return root}
  function pose(p,mode,t=0){const u=p.userData;u.mode=mode;u.mug.visible=mode==='coffee';
    const A=u.arms,Lg=u.legs;u.head.rotation.set(0,0,0);
    if(mode==='walk'){p.position.y=0;const ph=Math.sin(t/160);Lg[0].lg.rotation.x=ph*.5;Lg[1].lg.rotation.x=-ph*.5;Lg[0].kn.rotation.x=Math.max(0,-ph)*.5;Lg[1].kn.rotation.x=Math.max(0,ph)*.5;
      A[0].sh.rotation.set(-ph*.4,0,-.06);A[1].sh.rotation.set(ph*.4,0,.06);A[0].el.rotation.x=-.25;A[1].el.rotation.x=-.25;u.hips.position.y=.62+Math.abs(Math.cos(t/160))*.02;return}
    u.hips.position.y=.62;
    if(mode==='stand'){p.position.y=0;Lg.forEach(l=>{l.lg.rotation.x=0;l.kn.rotation.x=0});A.forEach((a,i)=>{a.sh.rotation.set(0,0,(i?1:-1)*.08);a.el.rotation.x=0});return}
    p.position.y=-.09;Lg.forEach(l=>{l.lg.rotation.x=-Math.PI/2;l.kn.rotation.x=Math.PI/2});
    if(mode==='type'){A.forEach((a,i)=>{a.sh.rotation.set(-.95,0,(i?1:-1)*-.05);a.el.rotation.x=-.75+Math.sin(t/75+i*Math.PI)*.1});u.head.rotation.x=.12}
    if(mode==='coffee'){A[1].sh.rotation.set(-.3,0,.05);A[1].el.rotation.x=-2.05;A[0].sh.rotation.set(-.85,0,-.05);A[0].el.rotation.x=-.45;u.head.rotation.y=.15}}

  /* posiciones: escritorios girados 180° (pantalla hacia la cámara) */
  const POS={claude:[-3.55,.14,-2.6,Math.PI],opencode2:[.2,0,-1.3,Math.PI],explorer:[-3.3,0,1.8,Math.PI],tester:[.9,0,1.8,Math.PI],suplente:[-1.2,0,1.8,Math.PI]};
  const WSLOT=[[-1.9,0,-.25,Math.PI],[2.1,0,-2.3,Math.PI],[4.3,0,-2.3,Math.PI]];
  const desks={},people={},seatOf={};

  function place(name,i){if(POS[name])return POS[name];return WSLOT[i%WSLOT.length]}
  function deskSeat(d){const v2=d.localToWorld(new THREE.Vector3(0,0,-.72));return{x:v2.x,y:d.position.y,z:v2.z,ry:d.rotation.y}}
  function tableSeat(name){if(seatOf[name]==null){const used=new Set(Object.values(seatOf));let k=0;while(used.has(k)&&k<5)k++;seatOf[name]=k}return tableSeats[seatOf[name]]}
  function goTo(p,tg,mode,instant){const u=p.userData;
    if(instant||!u.mode){p.position.x=tg.x;p.position.z=tg.z;p.rotation.y=tg.ry;u.base=tg.y||0;pose(p,mode);p.position.y+=u.base;return}
    const dx=tg.x-p.position.x,dz=tg.z-p.position.z,dist=Math.hypot(dx,dz);
    u.walk={x0:p.position.x,z0:p.position.z,tg,mode,t0:performance.now(),dur:Math.max(900,Math.min(3200,dist/1.3*1000)),ry:Math.atan2(dx,dz)};request()}
  function sync(agents){
    const names=new Set(agents.map(a=>a.name));
    for(const n of Object.keys(desks))if(!names.has(n)){world.remove(desks[n]);delete desks[n];world.remove(people[n]);delete people[n];delete seatOf[n]}
    let wi=0;
    for(const a of agents){
      const isW=!LOOK[a.name];const idx=isW?wi++:0;const L=lookOf(a.name,idx);
      let fresh=false;
      if(!desks[a.name]){const d=desk(L,a.name.length*7+idx*13);const p=place(a.name,idx);d.position.set(p[0],p[1],p[2]);d.rotation.y=p[3];d.userData.name=a.name;world.add(d);desks[a.name]=d;d.updateMatrixWorld()}
      if(!people[a.name]){const pe=employee(a.name,L,idx);world.add(pe);people[a.name]=pe;fresh=true}
      const d=desks[a.name],pe=people[a.name];const st=statusOf(a);
      d.userData.led.material=mat(LED[st],{emissive:LED[st],emissiveIntensity:1.3});d.userData.state=st;d.userData.act=a.activity;
      const atDesk=st!=='idle'&&!(a.name==='suplente'&&!S.suplencia);
      const want=atDesk?'type':'coffee';
      if(pe.userData.target!==want){pe.userData.target=want;goTo(pe,atDesk?deskSeat(d):tableSeat(a.name),want,fresh)}
      drawCode(d,a.name,a.activity,atDesk?st:'idle',performance.now());
    }
    drawScreen();drawBoard();request();
  }

  /* pantalla de métricas de la pared */
  function drawScreen(){
    const c=screenCanvas.getContext('2d'),w=1024,h=560,m=(S&&S.metrics)||{},b=m.base||{},p=m.produccion||{};
    const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#111827');g.addColorStop(1,'#0b1220');c.fillStyle=g;c.fillRect(0,0,w,h);
    c.fillStyle='#94a3b8';c.font='600 30px Inter,system-ui,sans-serif';c.fillText('PRODUCCIÓN · STRATA3060',48,70);
    const dB=p.B1&&b.B1?(p.B1/b.B1-1)*100:null, dP=p.P3_s&&b.P3_s?(b.P3_s/p.P3_s-1)*100:null;
    const big=(lab,val,unit,d,x)=>{c.fillStyle='#e5e7eb';c.font='600 26px Inter,system-ui,sans-serif';c.fillText(lab,x,140);
      c.font='750 116px Inter,system-ui,sans-serif';c.fillText(val,x,262);const vw=c.measureText(val).width;c.font='600 34px Inter,system-ui,sans-serif';c.fillStyle='#94a3b8';c.fillText(unit,x+vw+12,262);
      c.font='700 36px Inter,system-ui,sans-serif';c.fillStyle=d==null?'#94a3b8':d>0.05?'#34d399':d<-0.05?'#f87171':'#94a3b8';c.fillText(d==null?'—':(d>=0?'+':'')+fmt(d)+' % vs base',x,318)};
    big('ESCRITURA · B1',fmt(p.B1),'t/s',dB,48);big('LECTURA 32K · P3',fmt(p.P3_s),'s',dP,540);
    const hist=(m.historial||[]).map(x=>x.B1).filter(v=>v!=null);
    if(hist.length>1){const lo=Math.min(...hist)-1,hi=Math.max(...hist)+1;c.strokeStyle='#60a5fa';c.lineWidth=6;c.lineJoin='round';c.beginPath();
      hist.forEach((v,i)=>{const x=48+i*(928/(hist.length-1)),y=500-(v-lo)/(hi-lo)*120;i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();
      c.fillStyle='#64748b';c.font='500 22px Inter,system-ui,sans-serif';c.fillText('historial B1',48,540)}
    screenTex.needsUpdate=true;
  }

  /* cámara isométrica que encaja la sala */
  function resize(){const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;R.setSize(w,h,false);
    const aspect=w/h;const need=Math.max(7.6/aspect,5.2)/zoom/(w<700?1.25:1);cam.left=-need*aspect;cam.right=need*aspect;cam.top=need;cam.bottom=-need;
    const r=20;cam.position.set(Math.sin(az)*r*Math.cos(el),r*Math.sin(el),Math.cos(az)*r*Math.cos(el));cam.lookAt(0,.55,.2);cam.updateProjectionMatrix();request()}
  new ResizeObserver(resize).observe(host);

  /* interacción: arrastrar gira (limitado), rueda acerca, clic selecciona */
  const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let drag=null;
  R.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,az,moved:false};R.domElement.setPointerCapture(e.pointerId)});
  R.domElement.addEventListener('pointermove',e=>{if(drag){const dx=e.clientX-drag.x;if(Math.abs(dx)>3)drag.moved=true;az=Math.max(.15,Math.min(1.3,drag.az-dx*.005));resize()}else hover(e)});
  R.domElement.addEventListener('pointerup',e=>{if(drag&&!drag.moved)pick(e);drag=null});
  R.domElement.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.8,Math.min(1.9,zoom*(e.deltaY>0?.92:1.08)));resize()},{passive:false});
  function hitName(e){const r=R.domElement.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ptr,cam);
    const hits=ray.intersectObjects([...Object.values(desks).map(d=>d.userData.hit),...Object.values(people).map(p=>p.userData.hit)]);return hits[0]&&hits[0].object.parent.userData.name}
  function pick(e){const n=hitName(e);if(n)select(n)}
  let hovered=null;
  function hover(e){const n=hitName(e)||null;R.domElement.style.cursor=n?'pointer':'default';if(n!==hovered){hovered=n;placeLabels()}}
  R.domElement.addEventListener('pointerleave',()=>{if(hovered){hovered=null;placeLabels()}});

  /* bucle bajo demanda: solo anima si alguien trabaja o el rack está activo */
  let need=true,last=0,running=false;
  function request(){need=true;if(!running){running=true;requestAnimationFrame(tick)}}
  function animating(){return Object.values(people).some(p=>p.userData.walk||p.userData.mode==='type')||(S&&S.lock)}
  let lastScr=0;
  function tick(t){
    if(document.hidden){running=false;return}
    const anim=animating();
    if(anim&&t-last<1000/30){requestAnimationFrame(tick);return}
    last=t;const now=performance.now();
    for(const p of Object.values(people)){const u=p.userData;
      if(u.walk){const w=u.walk,k=Math.min(1,(now-w.t0)/w.dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
        p.position.x=w.x0+(w.tg.x-w.x0)*e;p.position.z=w.z0+(w.tg.z-w.z0)*e;p.rotation.y=w.ry;pose(p,'walk',now);
        if(k>=1){u.walk=null;p.rotation.y=w.tg.ry;u.base=w.tg.y||0;pose(p,w.mode);p.position.y+=u.base}}
      else if(u.mode==='type'){pose(p,'type',now);p.position.y+=u.base||0}}
    if(now-lastScr>250){lastScr=now;for(const [n,d] of Object.entries(desks)){const p=people[n];if(p&&p.userData.mode==='type'&&!p.userData.walk)drawCode(d,n,d.userData.act,'working',now)}}
    rackLeds.forEach((l,i)=>{l.visible=!(S&&S.lock)||((Math.floor(t/180)+i)%3!==0)});
    R.render(sc,cam);placeLabels();need=false;
    if(anim)requestAnimationFrame(tick);else running=false;
  }
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)request()});

  /* etiquetas HTML proyectadas con anti-colisión */
  const v=new THREE.Vector3();
  function placeLabels(){
    const box=$('#labels'),w=host.clientWidth,h=host.clientHeight;if(!S)return;
    const items=[];
    for(const a of S.agents){const p=people[a.name];if(!p||a.name!==hovered)continue;
      p.userData.head.getWorldPosition(v);v.y+=.34;v.project(cam);
      items.push({a,x:(v.x+1)/2*w,y:(1-v.y)/2*h-26})}
    items.sort((p,q)=>q.y-p.y);
    for(let i=0;i<items.length;i++)for(let j=0;j<i;j++){const p=items[i],q=items[j];if(Math.abs(p.x-q.x)<140&&Math.abs(p.y-q.y)<26)p.y=q.y-26}
    box.innerHTML=items.map(({a,x,y})=>{const st=statusOf(a);const L=lookOf(a.name,workerIdx[a.name]||0);
      return`<div class="pill${a.name===sel?' sel':''}" data-a="${esc(a.name)}" style="left:${x}px;top:${y}px"><i class="led" style="background:${LED[st]}"></i>${esc(a.name)} <em>${esc(L.role)}</em></div>`}).join('')
      + bubbles(items);
    box.querySelectorAll('[data-a]').forEach(el=>el.onclick=()=>select(el.dataset.a));
  }
  function bubbles(items){
    const need=pendingAdrian();if(!need.length)return'';
    const p=people.opencode2;if(!p)return'';const w=host.clientWidth,h=host.clientHeight;p.userData.head.getWorldPosition(v);v.y+=.34;v.project(cam);
    const it={x:(v.x+1)/2*w,y:(1-v.y)/2*h-26};
    return`<div class="bub" data-a="opencode2" style="left:${it.x}px;top:${it.y-8}px"><b>TE NECESITA</b>${esc(need[0].id)} · ${esc(need[0].titulo)}</div>`}

  function applyTheme(){const dark=palette();hemi.color.set(theme.sky);hemi.groundColor.set(theme.ground);hemi.intensity=theme.hemiI;sun.intensity=theme.sunI;R.toneMappingExposure=theme.exp;
    for(const l of lamps)sc.remove(l);lamps.length=0;
    if(dark){for(const p of[[.2,1.6,-.6],[-3.5,1.7,-2.2],[3.4,1.6,-1]]){const l=new THREE.PointLight(0xffc98a,6,5,1.6);l.position.set(...p);sc.add(l);lamps.push(l)}}
    for(const k in M)delete M[k];
    for(const n of Object.keys(desks)){world.remove(desks[n]);delete desks[n]}
    for(const n of Object.keys(people)){world.remove(people[n]);delete people[n]}
    buildRoom();if(S)sync(S.agents);resize()}
  applyTheme();
  return{sync,applyTheme,request,resize,drawScreen};
})();

function pendingAdrian(){return(S?.tareas||[]).filter(t=>t.columna==='ESPERA OK'&&t.aprobador==='adrian')}
function waitingClaude(){return(S?.tareas||[]).filter(t=>t.columna==='ESPERA OK'&&t.aprobador!=='adrian')}
function tasksOf(name){const T=S?.tareas||[];if(name==='claude')return waitingClaude();
  return T.filter(t=>(t.columna==='EN CURSO'||t.columna==='ESPERA OK')&&(t.responsable===name||(name==='opencode2'&&/^obrero/.test(t.responsable||''))))}

}
function renderInspector(){
  const pane=$('#ipane');const a=S.agents.find(x=>x.name===sel)||S.agents[0];if(!a)return;sel=a.name;
  if(tab==='salida'){loadLog(a.name);return}
  if(tab==='hilo'){loadHilo(a.name);return}
  const st=statusOf(a);const stTxt={working:'trabajando',idle:'en reposo',waiting:'espera',blocked:'bloqueado'}[st];
  const L=lookOf(a.name,workerIdx[a.name]||0);
  const need=pendingAdrian(),wc=waitingClaude(),tl=tasksOf(a.name);
  pane.innerHTML=`
    <div class="who">${avatarSVG(a.name,workerIdx[a.name]||0)}<div><b>${esc(a.name)}</b><small>${esc(a.role||L.role)}</small><small title="${esc(a.since||'')}">${esc(stTxt)} · ${esc(rel(a.ts))}</small></div><span class="st ${st}">${st==='working'?'Working':st==='idle'?'Ready':st}</span></div>
    <p class="act">Ahora: <b>${esc(a.activity||'—')}</b></p>
    <div class="sec">Te necesita <span>${need.length||''}</span></div>
    ${need.length?need.map(t=>`<div class="need"><span class="tag">NEEDS YOU</span> <b>${esc(t.id)} · ${esc(t.titulo)}</b><p>${esc(t.nota||'')}</p>
      <div class="meta"><span>${esc(t.responsable||'')} · desde ${esc(t.inicio||'')}</span><span><button class="btn" data-rev="${esc(t.id)}">Revisar</button> <button class="btn pri" data-ok="${esc(t.id)}">Aprobar</button></span></div></div>`).join('')
      :'<div class="empty">✓ Nada pendiente para ti</div>'}
    ${wc.length?`<div class="sec">Esperando a claude <span>${wc.length}</span></div>${wc.map(t=>`<div class="wait"><i class="led" style="background:#f59e0b;margin-top:6px"></i><div><b>${esc(t.id)} · ${esc(t.titulo)}</b><br><span style="color:var(--muted)">${esc(t.nota||'')}</span></div></div>`).join('')}`:''}
    <div class="sec">Qué está haciendo de verdad</div>
    ${tl.length?tl.map(t=>`<div class="task"><p class="tt">${esc(t.id)} <span>· ${esc(t.titulo)}</span></p><div class="tl">${(t.pasos||[{nombre:t.nota||'en curso',estado:'curso',pct:50}]).map(s=>
      `<div class="step ${s.estado==='hecho'?'hecho':s.estado==='curso'?'curso':''}"><b>${esc(s.nombre)}</b><small>${s.estado==='hecho'?'hecho':s.estado==='curso'?'en curso · '+(s.pct||0)+' %':'pendiente'}</small>${s.estado==='curso'?`<div class="bar"><i style="width:${s.pct||0}%"></i></div>`:''}</div>`).join('')}</div></div>`).join('')
      :'<div class="empty">Sin tareas asignadas ahora mismo</div>'}`;
  pane.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>confirmModal('Aprobar '+b.dataset.ok,'Se enviará a claude: “OK a '+b.dataset.ok+'”. claude lo comunicará a quien corresponda.',()=>send('claude','viaclaude','OK a '+b.dataset.ok)));
  pane.querySelectorAll('[data-rev]').forEach(b=>b.onclick=()=>{to='claude';updateTo();$('#msg').value='Revisa conmigo '+b.dataset.rev+': ';$('#msg').focus()});
}
async function loadLog(n){$('#ipane').innerHTML='<div class="empty">Cargando terminal…</div>';
  try{const d=await api('/api/log?agent='+encodeURIComponent(n));if(sel!==n||tab!=='salida')return;
    $('#ipane').innerHTML=d.error?`<div class="empty">${esc(d.error)}</div>`:`<pre class="log mono">${esc(d.lines.join('\n'))}</pre>`;const p=$('#ipane');p.scrollTop=p.scrollHeight}catch(_){}}
async function loadHilo(n){$('#ipane').innerHTML='<div class="empty">Cargando…</div>';
  try{const d=await api('/api/hilo?agent='+encodeURIComponent(n));if(sel!==n||tab!=='hilo')return;
    const m=[...(d.envios||[]).map(x=>`<div class="m"><small>enviado desde la oficina</small>${esc(x)}</div>`),...(d.menciones||[]).map(x=>`<div class="m"><small>CHANGELOG</small>${esc(x)}</div>`)];
    $('#ipane').innerHTML=`<div class="msgs">${m.join('')||'<div class="empty">Sin mensajes todavía</div>'}</div>`}catch(_){}}
let logTimer=setInterval(()=>{if(tab==='salida'&&sel)loadLog(sel)},5000);

function delta(p,b,lower){if(p==null||b==null)return null;return lower?(b/p-1)*100:(p/b-1)*100}
function spark(vals){if(vals.length<2)return'<svg></svg>';const lo=Math.min(...vals),hi=Math.max(...vals),r=hi-lo||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*100).toFixed(1)},${(38-(v-lo)/r*32).toFixed(1)}`).join(' ');
  return`<svg viewBox="0 0 100 42" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`}
function renderMetrics(){
  const m=S.metrics||{},p=m.produccion||{},b=m.base||{},h=m.historial||[];
  const card=(k,lab,unit,lower)=>{const d=delta(p[k],b[k],lower);const vals=h.map(x=>x[k]).filter(v=>v!=null);
    return`<div class="card mcard"><small>${lab}</small><div class="v">${fmt(p[k])}<span>${unit}</span></div><div class="d ${d>0.05?'up':d<-0.05?'down':'flat'}">${d==null?'—':(d>=0?'+':'')+fmt(d)+' % vs base'} <span style="color:var(--muted);font-weight:500">· base ${fmt(b[k])}</span></div>${spark(vals)}</div>`};
  const goal=(lab,cur,base,target,lower,unit)=>{const pr=cur==null?0:Math.max(0,Math.min(1,lower?(base-cur)/(base-target):(cur-base)/(target-base)));
    return`<div class="card goal"><b>${lab}</b><div class="bar"><i style="width:${(pr*100).toFixed(0)}%"></i></div><small>${fmt(cur)} ${unit} ahora · objetivo ${fmt(target,0)} ${unit} · ${(pr*100).toFixed(0)} %</small></div>`};
  const boss=m.jefe||{nombre:'Espera del bus PCIe (waitB)',ms:8.5,suelo:3.0};const hp=Math.max(0,Math.min(1,(boss.ms-boss.suelo)/(8.5-boss.suelo)));
  $('#pv-metricas').innerHTML=`
    <div class="grid g5">${card('B1','Escritura · B1','t/s')}${card('B2','Escritura · B2','t/s')}${card('B4','Código copiado · B4','t/s')}${card('P3_s','Lectura 32K · P3','s',true)}${card('P4_s','Lectura 86K · P4','s',true)}</div>
    <div class="grid g3" style="margin-top:12px">
      ${goal('Misión: escritura a 60 t/s',p.B1,b.B1,60,false,'t/s')}
      ${goal('Misión: leer 32K en 10 s',p.P3_s,b.P3_s,10,true,'s')}
      <div class="card goal"><b>Candidato en prueba</b><p style="margin:8px 0 0;color:var(--muted)">${esc(m.candidato?.nombre||'ninguno')} · ${esc(m.candidato?.IC||'')}</p></div>
    </div>
    <div class="card boss" style="margin-top:12px"><div><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-4 0-7 3-7 7v8l2-2 2 2 3-2 3 2 2-2 2 2v-8c0-4-3-7-7-7z"/><circle cx="9.5" cy="10" r="1.3" fill="#ef4444"/><circle cx="14.5" cy="10" r="1.3" fill="#ef4444"/></svg></div><div class="hp"><b>Jefe actual: ${esc(boss.nombre)}</b><div class="bar"><i style="width:${(hp*100).toFixed(0)}%"></i></div><small style="color:var(--muted)">${fmt(boss.ms)} ms perdidos por paso · suelo físico ${fmt(boss.suelo)} ms. Cada mejora adoptada le quita vida.</small></div></div>
    <div class="card" style="margin-top:12px;padding:16px"><b>Historial</b><div style="margin-top:8px">${h.slice(-8).reverse().map(x=>`<div style="display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px"><span class="mono" style="color:var(--muted);flex:none">${esc(x.fecha)}</span><span style="flex:1">${esc(x.cambio)}</span><b>${x.B1!=null?fmt(x.B1)+' t/s':''}</b></div>`).join('')}</div></div>`;
}
function renderBoard(){
  const cols=['EN COLA','EN CURSO','ESPERA OK','HECHO','DESCARTADO'];const T=S.tareas||[];
  $('#pv-tablero').innerHTML=`<div class="kan">${cols.map(c=>{const ts=T.filter(t=>t.columna===c);return`<div class="col"><h4>${c}<span>${ts.length}</span></h4>${ts.map(t=>{const L=lookOf(t.responsable,0);
    return`<div class="tc"><b>${esc(t.id)} · ${esc(t.titulo)}</b><p>${esc(t.nota||'')}</p><div class="who2"><i class="led" style="background:${L.shirt}"></i>${esc(t.responsable||'—')}${t.aprobador?' · aprueba '+esc(t.aprobador):''}</div></div>`}).join('')}</div>`}).join('')}</div>`;
}
function renderCampus(){
  const offs=OFFICES.length?OFFICES:[{id:'w1',nombre:'Strata3060',agentes:S.agents.map(a=>a.name),tareas:(S.tareas||[]).length,foco:true}];
  $('#pv-campus').innerHTML=`<div class="camp">${offs.map(o=>`<button class="card oc" data-off="${esc(o.id)}"><div class="ill">${o.foco?ICB:ICF}</div><b>${esc(o.nombre==='Servidor IA'?'Strata3060':o.nombre)}</b><div style="color:var(--muted);font-size:12px">${o.agentes.length} agentes · ${o.tareas} tareas</div>${o.needs?'<i class="dot"></i>':''}</button>`).join('')}
    <button class="card oc new" id="newOff2" style="display:grid;place-items:center;min-height:190px">+ Nueva oficina</button></div>`;
  $('#newOff2').onclick=newOffice;
  $$('#pv-campus [data-off]').forEach(b=>b.onclick=()=>setView('oficina'));
}
function renderAll(){if(!S)return;renderHeader();renderSide();if(view==='oficina'||tab!=='inspector')renderInspector();else renderInspector();
  if(view==='metricas')renderMetrics();if(view==='tablero')renderBoard();if(view==='campus')renderCampus();renderMenu();updateTo()}

/* vistas */
function setView(v){view=v;$$('.rb[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  $$('.panelview').forEach(p=>p.classList.toggle('on',p.id==='pv-'+v));
  const o=v==='oficina';$('#scene').style.visibility=o?'visible':'hidden';$('#labels').style.display=o?'':'none';$$('.float,.legend').forEach(e=>e.style.display=o?'':'none');
  if(o)scene3d.resize();renderAll()}
$$('.rb[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
$$('[data-goto]').forEach(b=>b.onclick=()=>setView(b.dataset.goto));
$$('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;$$('.tab').forEach(x=>x.classList.toggle('on',x===b));renderInspector()});

$('#closeInsp').onclick=()=>$('#stage').classList.remove('drawer');
function select(n){sel=n;store.set('sel',n);$('#stage').classList.add('drawer');if(n!=='claude'&&n!=='tester'){to=n}renderInspector();scene3d.request();updateTo()}

/* chat */
function renderMenu(){$('#menu').innerHTML=agentList().map(a=>`<button type="button" data-to="${esc(a.name)}" class="${a.name===to?'on':''}"><i class="led" style="background:${LED[statusOf(a)]}"></i>@${esc(a.name)}<small>${a.name==='claude'?'a la cola':'directo'}</small></button>`).join('');
  $$('#menu [data-to]').forEach(b=>b.onclick=()=>{to=b.dataset.to;updateTo();$('#menu').classList.remove('open');$('#msg').focus()})}
function updateTo(){const a=agentList().find(x=>x.name===to)||{name:to,status:'idle'};$('#to span').textContent='@'+to;$('#to .led').style.background=LED[statusOf(a)];
  $('#msg').placeholder=to==='claude'?'Escribe una tarea… claude la convierte en contrato y la pone en la cola':`Mensaje directo a ${to} (lo recibe como orden de Adrián)`}
$('#to').onclick=e=>{e.stopPropagation();$('#menu').classList.toggle('open')};
document.addEventListener('click',()=>$('#menu').classList.remove('open'));
$('#chat').onsubmit=e=>{e.preventDefault();const t=$('#msg').value.trim();if(!t)return;
  const go=()=>send(to,to==='claude'?'viaclaude':'direct',t).then(ok=>{if(ok)$('#msg').value=''});
  if(to==='tester')confirmModal('Mensaje directo a tester','tester comparte el motor con las mediciones: un mensaje ahora puede contaminar las cifras. ¿Enviar igualmente?',go);else go()};
async function send(agent,mode,text){try{const r=await api('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agent,mode,text})});
  if(r.ok){const who=mode==='viaclaude'?'claude':agent;toast(r.confirmed?`Entregado a ${who} ✓ · mira su respuesta en Salida`:'Enviado (sin confirmación de entrega)');
    sel=who;tab='salida';$$('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab==='salida'));$('#stage').classList.add('drawer');renderInspector();scene3d.request();return true}toast(r.error||'Error al enviar',true)}catch(_){toast('No se pudo enviar',true)}return false}

/* modal */
function confirmModal(t,p,ok,body=''){$('#mt').textContent=t;$('#mp').textContent=p;$('#mb').innerHTML=body;$('#modal').classList.add('on');
  $('#mo').onclick=()=>{$('#modal').classList.remove('on');ok()};$('#mc').onclick=()=>$('#modal').classList.remove('on');setTimeout(()=>($('#mb input')||$('#mo')).focus(),30)}
function newOffice(){confirmModal('Nueva oficina','Se crea un workspace nuevo en herdr con este nombre. Después puedes arrancar agentes en él.',async()=>{
  const n=$('#mb input').value.trim();if(!n)return;try{const r=await api('/api/office',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});
  toast(r.ok?`Oficina “${n}” creada ✓`:(r.error||'No se pudo crear'),!r.ok);loadOffices()}catch(_){toast('No se pudo crear',true)}},'<input placeholder="Nombre del proyecto" maxlength="40">')}
$('#newOff').onclick=newOffice;

/* teclado */
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'){if(e.key==='Escape')e.target.blur();return}
  const k=e.key.toLowerCase();if(k==='escape'){$('#stage').classList.remove('drawer');$('#modal').classList.remove('on');$('#menu').classList.remove('open');setView('oficina')}
  else if(k==='t')setView('tablero');else if(k==='m')setView('metricas');else if(k==='c')setView('campus');else if(k==='o')setView('oficina');
  else if(k==='/'){e.preventDefault();$('#msg').focus()}else if(/^[1-9]$/.test(k)){const a=agentList()[+k-1];if(a)select(a.name)}});

/* reloj y diseño compacto */
function clock(){$('#clock').textContent=new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}setInterval(clock,10000);clock();
new ResizeObserver(()=>$('#stage').classList.toggle('compact',$('#stage').clientWidth<1150)).observe($('#stage'));

/* datos: SSE con reconexión y respaldo por sondeo */
function apply(st){const prevW=JSON.stringify(S?.agents?.map(a=>[a.name,a.status,a.activity]));S=st;
  let wi=0;for(const a of S.agents)if(!LOOK[a.name])workerIdx[a.name]=wi++;
  scene3d.sync(S.agents);renderAll();if(prevW!==JSON.stringify(S.agents.map(a=>[a.name,a.status,a.activity])))scene3d.request()}
async function loadOffices(){try{OFFICES=(await api('/api/offices')).offices||[];if(S)renderSide()}catch(_){}}
function connect(){const es=new EventSource('/api/events');es.onmessage=e=>{try{apply(JSON.parse(e.data))}catch(_){}};
  es.onerror=()=>{es.close();$('#live').className='live off';$('#live').textContent='reconectando…';setTimeout(connect,4000)}}
api('/api/state').then(apply).catch(()=>{});loadOffices();setInterval(loadOffices,60000);connect();
</script>
</body>
