<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oficina · acceso</title>
<style>
:root{--bg:#eef0f4;--panel:#fff;--text:#0f172a;--muted:#64748b;--line:#e3e6ec;--accent:#2563eb;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0d12;--panel:#141821;--text:#e5e7eb;--muted:#94a3b8;--line:#252a37;--accent:#60a5fa;--bad:#f87171}}
:root[data-theme=dark]{--bg:#0b0d12;--panel:#141821;--text:#e5e7eb;--muted:#94a3b8;--line:#252a37;--accent:#60a5fa;--bad:#f87171}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{min-height:100%;display:grid;place-items:center;padding:16px}
form{width:min(360px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:32px 28px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 40px rgba(15,23,42,.08)}
.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#22c55e,#15803d);color:#fff;margin-bottom:18px}
h1{font-size:20px;margin:0 0 4px;font-weight:650;letter-spacing:-.01em}
p{margin:0 0 22px;color:var(--muted);font-size:14px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}
input{width:100%;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
button{margin-top:16px;width:100%;font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px;background:var(--text);color:var(--panel);cursor:pointer;transition:transform .12s,opacity .15s}
button:hover{opacity:.9}button:active{transform:scale(.99)}button:disabled{opacity:.5;cursor:default}
.err{min-height:20px;margin-top:12px;color:var(--bad);font-size:13px}
</style>
</head>
<body>
<main>
<form id="f" autocomplete="on">
  <div class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6"/></svg></div>
  <h1>Oficina Strata</h1>
  <p>Introduce la contraseña para entrar.</p>
  <label for="pw">Contraseña</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <button id="b" type="submit">Entrar</button>
  <div class="err" id="e" role="alert"></div>
</form>
</main>
<script>
try{const t=localStorage.getItem('tema');if(t)document.documentElement.dataset.theme=t}catch(_){}
const f=document.getElementById('f'),b=document.getElementById('b'),e=document.getElementById('e');
f.addEventListener('submit',async ev=>{
  ev.preventDefault();b.disabled=true;e.textContent='';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});
    if(r.ok){location.href='/';return}
    e.textContent=r.status===429?'Demasiados intentos. Espera 15 minutos.':'Contraseña incorrecta.';
  }catch(_){e.textContent='No se puede conectar con la oficina.'}
  b.disabled=false;
});
</script>
</body>
</html>
